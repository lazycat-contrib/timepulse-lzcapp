version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-action/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git

build:
  run_buildscript: false

images: []

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
    application:
      language: zh
      name: TimePulse
      source: https://github.com/RavelloH/TimePulse
      source_author: RavelloH
  private:
    enabled: true
    skip_if_version_exists: true
    name: TimePulse
    summary: 由 GitHub Actions 自动发布
